name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.compiler }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc
          - clang

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build and test
        run: make clean check CC=${{ matrix.compiler }}

      - name: Verify version and size
        run: |
          ./envdiff --version
          test "$(wc -c < envdiff)" -le 102400
