name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            cmake_args: -DCMAKE_C_COMPILER=gcc
            executable: build/envdiff
            archive: envdiff-${{ github.ref_name }}-linux.tar.gz
          - name: macos
            os: macos-latest
            cmake_args: -DCMAKE_C_COMPILER=clang
            executable: build/envdiff
            archive: envdiff-${{ github.ref_name }}-macos.tar.gz
          - name: windows
            os: windows-latest
            cmake_args: ""
            executable: build/Release/envdiff.exe
            archive: envdiff-${{ github.ref_name }}-windows.zip

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Unix executable
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/package
          cp "${{ matrix.executable }}" README.md LICENSE dist/package/
          tar -czf "dist/${{ matrix.archive }}" -C dist/package .

      - name: Package Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/package | Out-Null
          Copy-Item "${{ matrix.executable }}", README.md, LICENSE dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/${{ matrix.archive }}"

      - name: Upload release artifact
        uses: actions/upload-artifact@v7
        with:
          name: envdiff-${{ matrix.name }}
          path: dist/${{ matrix.archive }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: envdiff-*
          path: dist
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
          gh release upload "$GITHUB_REF_NAME" dist/* --clobber
