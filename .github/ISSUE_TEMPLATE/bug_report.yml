name: Bug report
description: Report incorrect behavior or a regression
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include real `.env` secrets in this report.
  - type: input
    id: version
    attributes:
      label: envdiff version
      description: Output of `envdiff --version`.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: Ubuntu 24.04, x86_64
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Use sanitized example data only.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include sanitized example and working files if possible.
      render: shell
    validations:
      required: true
